[package]
name = "mpl_studio"
version = "0.1.0"
description = "MPL Studio — local music programming editor"
authors = ["MPL"]
edition = "2021"

[lib]
name = "mpl_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
